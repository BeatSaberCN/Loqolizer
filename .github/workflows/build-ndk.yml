name: NDK build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - 'master'
      - 'main'
      - 'dev/*'
      - 'feat/*'
      - 'fix/*'
    paths-ignore:
      - '**.yml'
      - '!.github/workflows/build-ndk.yml'
      - '**.json'
      - '!qpm.json'
      - '!qpm.shared.json'
      - '!mod.template.json'
      - '**.txt'
      - '!CMakeLists.txt'
      - '**.ps1'
      - '!build.ps1'
      - '!createqmod.ps1'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
        - 'master'
        - 'main'
        - 'dev/*'
        - 'feat/*'
        - 'fix/*'

env:
    module_id: "Loqolizer"
    qmod_name: "Loqolizer"

jobs:
  download_resources:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      name: Checkout
      with:
        submodules: true
        lfs: true
    - name: Download resources
      run: |
        cd ${GITHUB_WORKSPACE}
        mkdir build
        python3 scripts/download_translates.py build/EmbbedDataGenerated.cpp
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EmbbedData
        path: |
          ${GITHUB_WORKSPACE}/build/EmbbedDataGenerated.cpp
          ${GITHUB_WORKSPACE}/EmbbedDataReport.json
        if-no-files-found: error


  build:
    needs: download_resources
    strategy:
      matrix:
        game-version: [
          "1.45.3",
          "1.40.8"
        ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      name: Checkout
      with:
        submodules: true
        lfs: true

    - uses: seanmiddleditch/gha-setup-ninja@v3

    - name: Create ndkpath.txt
      run: |
        echo $ANDROID_NDK_HOME > ${GITHUB_WORKSPACE}/ndkpath.txt
        cat ${GITHUB_WORKSPACE}/ndkpath.txt

    # get version from pushed tag
    - name: Extract version
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_OUTPUT}
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> ${GITHUB_OUTPUT}

    - name: Apply game version
      run: python scripts/multibuild/apply.py ${{ matrix.game-version }}

    - name: Setup qpm
      uses: Fernthedev/qpm-action@v1
      with:
        workflow_token: ${{ secrets.GITHUB_TOKEN }}
        restore: true
        cache: true
        publish: false

    - name: download embbed data
      uses: actions/download-artifact@v4
      with:
        path: build
        pattern: EmbbedData
        merge-multiple: false
    - name: list all
      run: pwd && ls build

    - name: Build & Create Qmod
      run: |
        cd ${GITHUB_WORKSPACE}
        qpm restore && qpm s build && qpm qmod zip
        mv ./build/libLoqolizer.so ./build/libLoqolizer.${{ matrix.game-version }}.so
        mv ./build/debug/libLoqolizer.so ./build/debug_libLoqolizer.${{ matrix.game-version }}.so
    
    - name: Upload so file artifact
      uses: actions/upload-artifact@v4
      with:
        name: libLoqolizer.${{ matrix.game-version }}.so
        path: |
          ./build/libLoqolizer.*.so
          ./build/debug_libLoqolizer.*.so
        if-no-files-found: error

    - name: Upload qmod artifact
      uses: actions/upload-artifact@v4
      with:
        name: Loqolizer.${{ matrix.game-version }}.qmod
        path: ./Loqolizer.${{ matrix.game-version }}.qmod
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download qmods
      uses: actions/download-artifact@v4
      with:
        path: release_folder
        pattern: Loqolizer.*.qmod
        merge-multiple: true
    - name: Download symbols
      uses: actions/download-artifact@v4
      with:
        path: symbols
        pattern: libLoqolizer.*.so
        merge-multiple: true
    - name: Download embbed datas
      uses: actions/download-artifact@v4
      with:
        path: release_folder
        pattern: EmbbedData
        merge-multiple: true
    - name: Zip datas
      run: |
        ls -l
        ls -l release_folder
        ls -l symbols
        tar zcvf release_folder/symbols.tgz symbols

    - name: Upload release artifacts
      id: upload_file_release
      uses: softprops/action-gh-release@v0.1.15
      with:
        tag_name: ${{ github.event.inputs.version }}
        draft: true
        generate_release_notes: true
        files: |
          ./release_folder/
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
