name: Auto release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 */5 * *'

concurrency: auto-release

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_new_data: ${{ steps.mod.outputs.has_new_data }}
      next_ver: ${{ steps.mod.outputs.next_ver }}
    steps:
    - uses: actions/checkout@v2
      name: Checkout

    - name: Check New Data
      id: mod
      run: python scripts/auto_release_helper.py

    - name: Upload automatic release metadata
      if: steps.mod.outputs.has_new_data == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AutoReleaseMetadata
        path: |
          qpm.json
          mod.template.json
          AutoReleaseChangelog.txt
        if-no-files-found: error

  build_and_release:
    needs: prepare
    if: needs.prepare.outputs.has_new_data == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-ndk.yml
    with:
      auto_release_version: ${{ needs.prepare.outputs.next_ver }}
